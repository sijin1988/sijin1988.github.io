<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검증 일정 관리</title>
<style>
  :root{
    --bg:#EEF1F5; --surface:#FFFFFF; --surface-alt:#F5F7FA; --ink:#1F2933; --ink-soft:#5B6B7A;
    --line:#DCE2E8; --navy:#2C3E52; --navy-deep:#1B2735; --radius:10px;

    --vms-bg:#E6F1FB; --vms-fg:#0C447C;
    --mobile-bg:#EEEDFE; --mobile-fg:#3C3489;
    --app-bg:#FAEEDA; --app-fg:#854F0B;
    --web-bg:#E1F5EE; --web-fg:#085041;
    --etc-bg:#F1EFE8; --etc-fg:#444441;
    --leave-bg:#FBE7EE; --leave-fg:#9B2E52;

    --st-plan-bg:#F1EFE8; --st-plan-fg:#444441;
    --st-prog-bg:#E6F1FB; --st-prog-fg:#0C447C;
    --st-done-bg:#EAF3DE; --st-done-fg:#27500A;
    --st-hold-bg:#FAEEDA; --st-hold-fg:#854F0B;
    --st-fail-bg:#FCEBEB; --st-fail-fg:#791F1F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;line-height:1.45;padding:18px 14px 60px;}
  .wrap{max-width:min(1500px, 96vw);margin:0 auto;}
  header.top{margin-bottom:14px;}
  header.top h1{font-size:20px;margin:0 0 2px;color:var(--navy-deep);}
  header.top p{margin:0;font-size:12.5px;color:var(--ink-soft);}

  .tabs{display:flex;gap:6px;margin:14px 0 12px;}
  .tabs button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  .tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}
  .toolbar input[type=text], .toolbar select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;background:var(--surface-alt);font-family:inherit;}
  .toolbar input[type=text]{flex:1;min-width:140px;}
  .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--ink);}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
  .btn.small{padding:3px 8px;font-size:12px;}
  .btn.icon{padding:4px 7px;font-size:12px;}

  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap;}
  .b-vms{background:var(--vms-bg);color:var(--vms-fg);}
  .b-mobile{background:var(--mobile-bg);color:var(--mobile-fg);}
  .b-app{background:var(--app-bg);color:var(--app-fg);}
  .b-web{background:var(--web-bg);color:var(--web-fg);}
  .b-etc{background:var(--etc-bg);color:var(--etc-fg);}
  .b-leave{background:var(--leave-bg);color:var(--leave-fg);}
  .s-plan{background:var(--st-plan-bg);color:var(--st-plan-fg);}
  .s-prog{background:var(--st-prog-bg);color:var(--st-prog-fg);}
  .s-done{background:var(--st-done-bg);color:var(--st-done-fg);}
  .s-hold{background:var(--st-hold-bg);color:var(--st-hold-fg);}
  .s-fail{background:var(--st-fail-bg);color:var(--st-fail-fg);}

  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-alt);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12.5px;}
  .chip button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;line-height:1;}

  .list-scroll{max-height:65vh;overflow-y:auto;padding-right:2px;}
  .period-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .period-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-alt);border-bottom:1px solid var(--line);}
  .period-head .label{font-weight:700;font-size:13.5px;color:var(--navy-deep);}
  .period-head .count{font-size:12px;color:var(--ink-soft);}
  .task-row{display:grid;grid-template-columns:auto auto 1fr auto auto auto;gap:10px;align-items:start;padding:9px 12px;border-top:1px solid var(--line);}
  .task-row:first-of-type{border-top:none;}
  .task-row .title{font-size:13.5px;font-weight:600;}
  .task-row .note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .task-row .subitems{margin-top:4px;}
  .task-row .subitem{font-size:12px;color:var(--ink-soft);}
  .item-row{display:grid;grid-template-columns:100px 1fr 84px auto;gap:6px;margin-bottom:6px;align-items:center;}
  .item-row select.item-assignee{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 6px;font-size:12.5px;font-family:inherit;background:var(--surface-alt);}
  .item-row select.item-status{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 4px;font-size:12px;font-family:inherit;background:var(--surface-alt);}
  .item-row input.item-text{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;background:var(--surface-alt);}
  .task-row .assignees{display:flex;flex-wrap:wrap;gap:4px;}
  .task-row .dates{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .task-row .actions{display:flex;gap:4px;}
  @media (max-width:760px){
    .task-row{grid-template-columns:1fr;grid-template-areas:"track" "titlearea" "meta" "actionsarea"; row-gap:6px;}
  }

  .timeline-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:16px;overflow-x:auto;}
  .timeline-axis{display:flex;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px;position:relative;height:16px;}
  .timeline-row{position:relative;height:28px;margin-bottom:4px;}
  .timeline-bar{position:absolute;top:2px;height:22px;border-radius:6px;font-size:11px;color:inherit;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:pointer;}

  .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .cal-dow{background:var(--surface-alt);text-align:center;font-size:12px;padding:6px 0;color:var(--ink-soft);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .cal-dow:nth-child(7n){border-right:none;}
  .cal-cell{background:var(--surface);height:150px;padding:4px;box-sizing:border-box;overflow-y:auto;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.out{background:var(--surface-alt);opacity:0.55;}
  .cal-date{font-size:11.5px;color:var(--ink-soft);margin-bottom:2px;}
  .cal-cell.today .cal-date{color:var(--navy);font-weight:700;}
  .cal-pill{display:block;width:100%;box-sizing:border-box;font-size:10.5px;padding:1px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  @media (max-width:700px){ .cal-cell{height:96px;} .cal-pill{font-size:9.5px;} }

  .person-manage{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;}
  .person-manage input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;width:120px;}

  .person-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;}
  .person-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .person-card .pname{font-weight:700;font-size:14.5px;color:var(--navy-deep);}
  .person-card .pname:hover{text-decoration:underline;}
  .modal.pp-box{max-width:min(1100px,96vw);padding:20px 24px;}
  .pp-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .pp-head h3{font-size:18px;color:var(--navy-deep);}
  .pp-count{font-size:12px;color:var(--ink-soft);}
  .pp-leave{font-size:12.5px;color:var(--leave-fg);background:var(--leave-bg);border-radius:8px;padding:6px 10px;margin-bottom:10px;cursor:pointer;}
  .pp-body{max-height:calc(100vh - 220px);overflow-y:auto;}
  .pp-group{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:1;background:var(--surface-alt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--navy-deep);}
  .pp-row{display:grid;grid-template-columns:92px 84px minmax(0,1.6fr) minmax(0,1fr) 120px;gap:10px;align-items:start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;}
  .pp-row:hover{background:var(--surface-alt);}
  .pp-status{border:0;cursor:pointer;font-family:inherit;}
  .pp-title{font-weight:600;color:var(--ink);word-break:break-word;}
  .pp-note{font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .pp-parent{font-size:12.5px;color:var(--ink-soft);word-break:break-word;}
  .pp-dates{font-size:12.5px;color:var(--ink-soft);text-align:right;white-space:nowrap;}
  @media(max-width:720px){ .pp-row{grid-template-columns:auto auto 1fr;} .pp-parent,.pp-dates{grid-column:1 / -1;text-align:left;} }
  .person-card .pleave{width:100%;font-size:12px;color:var(--leave-fg);padding:2px 0 8px;}
  .ptask{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-top:1px dashed var(--line);}
  .ptask:first-of-type{border-top:none;}
  .ptask .ttl{font-size:13px;}
  .ptask .meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .empty{font-size:12.5px;color:var(--ink-soft);padding:6px 2px;}

  .overlay{position:fixed;inset:0;background:rgba(20,30,40,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;z-index:50;}
  .modal{background:var(--surface);border-radius:12px;padding:20px 22px;max-width:480px;width:100%;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--navy-deep);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13.5px;font-family:inherit;background:var(--surface-alt);
  }
  .field textarea{min-height:56px;resize:vertical;}
  .assignee-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .assignee-picker label{display:flex;align-items:center;gap:4px;background:var(--surface-alt);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:12.5px;cursor:pointer;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--ink-soft);}

  .muted{color:var(--ink-soft);}
  .e-QA{background:var(--vms-bg);color:var(--vms-fg);}
  .e-Staging{background:var(--app-bg);color:var(--app-fg);}
  .e-Prod{background:var(--mobile-bg);color:var(--mobile-fg);}
  .sc-personal{background:var(--web-bg);color:var(--web-fg);}
  .sc-shared{background:var(--etc-bg);color:var(--etc-fg);}
  .sum-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
  .sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
  .sum-label{font-size:12px;color:var(--ink-soft);}
  .frame-bar{display:flex;justify-content:flex-end;margin-bottom:4px;font-size:12px;}
  .frame-bar a{color:var(--ink-soft);text-decoration:none;}
  .frame-bar a:hover{color:var(--navy);text-decoration:underline;}
  .frame-box{width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
  .brk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px;}
  .brk-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .brk-head{display:flex;align-items:baseline;gap:8px;font-weight:700;color:var(--navy-deep);margin-bottom:8px;}
  .brk-head small{font-weight:400;color:var(--ink-soft);font-size:12px;}
  .brk-type{margin-top:8px;}
  .brk-type-h{font-size:13px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:3px;}
  .brk-cpu{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:2px 0 0 8px;}
  .sum-val{font-size:22px;font-weight:700;color:var(--navy-deep);}
  .sum-sub{font-size:11.5px;color:var(--ink-soft);}
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .tbl th{background:var(--surface-alt);text-align:left;font-size:12px;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;}
  .tbl tbody tr:hover{background:var(--surface-alt);}
  .tbl .num{text-align:right;white-space:nowrap;}
  .person-card.need-check{border-color:#E6A5A5;}
  .tbl tr.need-row td{background:#FFF6F6;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>검증 일정 관리</h1>
    <p>전체 일정과 담당자별 업무를 한 데이터로 같이 관리합니다. 변경사항은 자동 저장됩니다.</p>
  </header>

  <div id="fallbackNotice" style="display:none;background:var(--leave-bg);color:var(--leave-fg);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;margin-bottom:14px;">
    실시간 공유 저장소(Firebase)에 연결하지 못했어요 — 인터넷 연결을 확인해주세요. 연결되기 전까지 입력하는 내용은 <b>이 브라우저에만</b> 저장되고 다른 사람과 공유되지 않아요.
  </div>

  <div class="tabs">
    <button id="tabOverall" class="active">전체 일정</button>
    <button id="tabPerson">담당자별</button>
    <button id="tabSamples">보유시료현황</button>
    <button id="tabAgingMgmt">Aging관리</button>
    <button id="tabTcDash">TC대시보드</button>
  </div>

  <div class="toolbar" id="scheduleToolbar">
    <input type="text" id="searchInput" placeholder="제목/메모 검색">
    <select id="trackFilter">
      <option value="">전체 트랙</option>
      <option value="vms">VMS</option>
      <option value="mobile">Mobile</option>
      <option value="app">Appliance</option>
      <option value="web">WebClient</option>
      <option value="etc">공통/기타</option>
      <option value="leave">휴가/교육</option>
    </select>
    <select id="statusFilter">
      <option value="">전체 상태</option>
      <option value="plan">예정</option>
      <option value="prog">진행중</option>
      <option value="hold">보류</option>
      <option value="fail">FAIL</option>
      <option value="done">완료</option>
    </select>
    <div class="spacer"></div>
    <button class="btn primary" id="newTaskBtn">+ 새 작업</button>
  </div>

  <div id="overallView"></div>
  <div id="personView" style="display:none;"></div>
  <div id="samplesView" style="display:none;"></div>
  <div id="agingMgmtView" style="display:none;"></div>
  <div id="tcDashView" style="display:none;"></div>

  <div class="footer-actions">
    <div><span id="statusLabel">불러오는 중…</span> <button class="btn small" id="retrySaveBtn" style="display:none;margin-left:6px;">다시 저장</button></div>
    <div>
      <button class="btn small" id="exportBtn">백업 다운로드</button>
      <button class="btn small" id="importBtn">가져오기</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </div>
</div>


<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">새 작업</h3>
    <div class="field"><label>제목</label><input type="text" id="fTitle"></div>
    <div id="formError" style="display:none;color:#A6394A;font-size:12.5px;margin:-6px 0 10px;"></div>
    <div class="two-col">
      <div class="field"><label>트랙</label>
        <select id="fTrack">
          <option value="vms">VMS</option>
          <option value="mobile">Mobile</option>
          <option value="app">Appliance</option>
          <option value="web">WebClient</option>
          <option value="etc">공통/기타</option>
          <option value="leave">휴가/교육</option>
        </select>
      </div>
      <div class="field"><label>상태</label>
        <select id="fStatus">
          <option value="plan" selected>예정</option>
          <option value="prog">진행중</option>
          <option value="hold">보류</option>
          <option value="fail">FAIL</option>
          <option value="done">완료</option>
        </select>
      </div>
    </div>
    <div class="field"><label>담당자 (없으면 아래에서 추가)</label><div class="assignee-picker" id="fAssignees"></div></div>
    <div class="field">
      <label>세부 항목 (담당자별 업무 내용) — 업무를 쪼개서 나눠줄 때만 사용</label>
      <div id="fItems"></div>
      <button class="btn small" id="addItemBtn" type="button" style="margin-top:4px;">+ 항목 추가</button>
    </div>
    <div class="field"><label>기간 라벨 (예: 19주차, 9/17~9/19)</label><input type="text" id="fPeriod" placeholder="예: 25주차"></div>
    <div class="two-col">
      <div class="field"><label>시작일 (선택)</label><input type="date" id="fStart"></div>
      <div class="field"><label>종료일 (선택)</label><input type="date" id="fEnd"></div>
    </div>
    <div class="field"><label>메모</label><textarea id="fNote"></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="deleteTaskBtn" style="margin-right:auto;color:#A6394A;border-color:#A6394A;display:none;">삭제</button>
      <button class="btn" id="cancelModalBtn">취소</button>
      <button class="btn primary" id="saveTaskBtn">저장</button>
    </div>
  </div>
</div>

<script>
const TRACKS = {vms:'VMS', mobile:'Mobile', app:'Appliance', web:'WebClient', etc:'공통/기타', leave:'휴가/교육'};
const STATUSES = {plan:'예정', prog:'진행중', hold:'보류', fail:'FAIL', done:'완료'};

let data = { tasks: [], people: [], periodOrder: {}, samples: [], aging: [], agingChecks: [] };
let editingId = null;
let saveTimer = null;
let currentTab = 'overall';
let calMonth = new Date(); calMonth.setDate(1);
let hideDoneOverall = true; // 검증 목록: 완료 항목 숨기기 기본 체크

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function setStatus(t){ document.getElementById('statusLabel').textContent = t; }

function showConfirm(message, onYes){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.style.zIndex = 100;
  ov.innerHTML = `<div class="modal" style="max-width:340px;">
      <p style="font-size:14px;margin:0 0 18px;color:var(--ink);">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn" id="cnCancel">취소</button>
        <button class="btn primary" id="cnOk">확인</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=> ov.remove();
  ov.querySelector('#cnCancel').onclick = close;
  ov.querySelector('#cnOk').onclick = ()=>{ close(); onYes(); };
  ov.addEventListener('click', (e)=>{ if(e.target===ov) close(); });
}

const hasCloudStorage = !!__db;
const LOCAL_KEY = 'sched:data:local';
const docRef = hasCloudStorage ? __db.collection('schedule').doc('main') : null;
// ---- 동시 편집 병합 (3-way merge) ----
// base = 내가 마지막으로 본 서버 상태, local = 내 화면 데이터, server = 지금 서버 데이터
// 내가 바꾼 항목만 서버 최신 데이터에 합치고, 남이 추가/수정한 항목은 그대로 둔다.
function _stable(v){
  if(Array.isArray(v)) return '['+v.map(_stable).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+_stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const _clone = v => JSON.parse(JSON.stringify(v));
const _same = (a,b) => _stable(a)===_stable(b);
function mergeById(base, local, server){
  const bm=new Map((base||[]).map(x=>[x.id,x])), lm=new Map((local||[]).map(x=>[x.id,x]));
  const out=[], used=new Set();
  for(const s of (server||[])){
    used.add(s.id);
    const inB=bm.has(s.id), inL=lm.has(s.id);
    if(inB && !inL) continue;                                              // 내가 삭제함
    if(inL && (!inB || !_same(lm.get(s.id), bm.get(s.id)))) out.push(lm.get(s.id)); // 내가 수정함
    else out.push(s);                                                      // 내가 안 건드림 → 서버 최신본
  }
  for(const l of (local||[])){
    if(used.has(l.id)) continue;
    if(!bm.has(l.id)) out.push(l);                                         // 내가 새로 추가함
    else if(!_same(l, bm.get(l.id))) out.push(l);                          // 남이 지웠지만 내가 수정함 → 내 수정 유지
    // 남이 지웠고 나는 안 건드림 → 삭제 유지
  }
  return out;
}
function mergeMap(base, local, server){
  const out={...(server||{})}, b=base||{}, l=local||{};
  for(const k of Object.keys(l)){ if(!(k in b) || !_same(l[k], b[k])) out[k]=l[k]; }
  for(const k of Object.keys(b)){ if(!(k in l)) delete out[k]; }
  return out;
}
function normalizeData(d){
  d = d || {};
  if(!Array.isArray(d.tasks)) d.tasks=[]; if(!Array.isArray(d.people)) d.people=[]; if(!d.periodOrder) d.periodOrder={};
  if(!d.weeklyDuty) d.weeklyDuty={};
  if(!Array.isArray(d.samples)) d.samples=[]; if(!Array.isArray(d.aging)) d.aging=[]; if(!Array.isArray(d.agingChecks)) d.agingChecks=[];
  return d;
}
function mergeData(base, local, server){
  base=normalizeData(base); local=normalizeData(local); server=normalizeData(server);
  const out={...server};
  out.tasks=mergeById(base.tasks, local.tasks, server.tasks);
  out.people=mergeById(base.people, local.people, server.people);
  out.periodOrder=mergeMap(base.periodOrder, local.periodOrder, server.periodOrder);
  out.weeklyDuty=mergeMap(base.weeklyDuty, local.weeklyDuty, server.weeklyDuty); // 코끼리 에어컨 주간 담당자
  out.samples=mergeById(base.samples, local.samples, server.samples);             // 보유시료현황
  out.aging=mergeById(base.aging, local.aging, server.aging);                     // (Aging 탭 삭제됨) 기존 저장 데이터 유지용
  out.agingChecks=mergeById(base.agingChecks, local.agingChecks, server.agingChecks); // (Aging 탭 삭제됨) 기존 저장 데이터 유지용
  return out;
}
let baseData = { tasks: [], people: [], periodOrder: {}, samples: [], aging: [], agingChecks: [] }; // 마지막으로 확인한 서버 상태
let saving = false, saveAgain = false;

// 서버에서 데이터를 "성공적으로" 읽었는지, 문서가 실제로 존재하는지 구분한다.
// 읽기에 실패한 상태에서는 절대 저장(덮어쓰기)하지 않는다.
let loadOk = false;
let docExists = false;
let lastKnownTaskCount = 0;
let allowEmptySave = false; // 사용자가 직접 마지막 작업을 삭제/백업 복원하는 경우에만 true로 잠깐 켠다

async function loadData(){
  if(hasCloudStorage){
    try{
      const snap = await docRef.get({source:'server'});
      loadOk = true;
      docExists = snap.exists;
      if(snap.exists) data = snap.data();
    }catch(e){ console.error(e); loadOk = false; }
  }else{
    loadOk = true;
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw) data = JSON.parse(raw);
    }catch(e){ /* nothing stored yet */ }
  }
  if(!data.tasks) data.tasks=[]; if(!data.people) data.people=[]; if(!data.periodOrder) data.periodOrder={};
  if(!data.weeklyDuty) data.weeklyDuty={};
  normalizeData(data);
  lastKnownTaskCount = data.tasks.length;
  baseData = _clone(data);
}
function watchRemoteChanges(){
  if(!hasCloudStorage) return;
  docRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const server = normalizeData(snap.data());
    if(_same(server, baseData)) return;                 // 변화 없음 (내 저장이 되돌아온 경우 포함)
    // 내 화면에 아직 저장 전 편집이 있으면 버리지 않고 서버 최신본에 합친다
    data = _same(data, baseData) ? _clone(server) : mergeData(baseData, data, server);
    baseData = _clone(server);
    lastKnownTaskCount = data.tasks.length;
    renderCurrentTab();
    setStatus('다른 사람의 변경사항을 반영했어요 · '+new Date().toLocaleTimeString('ko-KR'));
  }, err=>{ console.error('실시간 동기화 오류', err); });
}
async function saveData(isRetry, force){
  if(!hasCloudStorage){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
      setStatus('이 브라우저에 저장됨 · '+new Date().toLocaleTimeString('ko-KR'));
    }catch(e){
      console.error(e);
      setStatus('이 브라우저에 저장하지 못했어요. 아래 "백업 다운로드"로 내용을 꼭 저장해두세요.');
    }
    return;
  }
  // 서버 읽기에 실패한 상태의 화면 데이터로는 저장하지 않는다 (데이터 유실 방지)
  if(!loadOk){
    setStatus('서버에서 데이터를 불러오지 못해 저장을 막았어요. 새로고침 후 다시 시도해주세요.');
    return;
  }
  // 기존에 있던 일정이 전부 사라지는 저장은 확인 없이 하지 않는다
  if(!force && data.tasks.length===0 && lastKnownTaskCount>0 && !allowEmptySave){
    setStatus('모든 작업이 삭제되는 저장은 막았어요. 새로고침 후 다시 시도해주세요.');
    return;
  }
  // 저장이 진행 중이면 끝난 뒤 한 번 더 저장한다 (저장 중 생긴 편집 보존)
  if(saving){ saveAgain = true; return; }
  saving = true;
  const sent = _clone(data), sentBase = _clone(baseData);
  try{
    // 저장 전에 시간별 백업을 남긴다 (규칙이 허용하지 않으면 조용히 건너뜀)
    try{
      const d = new Date(), p = n=>String(n).padStart(2,'0');
      const id = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}`;
      __db.collection('schedule_backups').doc(id).set({savedAt:new Date().toISOString(), data:sent}).catch(()=>{});
    }catch(_){}
    // 트랜잭션: 저장하는 순간의 서버 최신 데이터를 읽어, 내가 바꾼 항목만 합쳐서 쓴다.
    // (다른 사람이 그 사이에 저장했으면 자동으로 다시 시도됨)
    const merged = await __db.runTransaction(async tx=>{
      const s = await tx.get(docRef);
      const server = normalizeData(s.exists ? s.data() : {});
      const m = (force || !s.exists) ? sent : mergeData(sentBase, sent, server);
      tx.set(docRef, m);
      return m;
    });
    baseData = _clone(merged);
    // 남의 변경이 합쳐졌거나 저장 중 새 편집이 있었다면 화면 데이터에 반영
    const before = _stable(data);
    data = mergeData(sent, data, merged);
    lastKnownTaskCount = data.tasks.length;
    allowEmptySave = false;
    if(_stable(data)!==before) renderCurrentTab();
    setStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR'));
    document.getElementById('retrySaveBtn').style.display = 'none';
  }catch(e){
    console.error(e);
    if(!isRetry){
      setStatus('저장 중 오류 발생, 재시도 중…');
      setTimeout(()=> saveData(true), 1200);
    }else{
      setStatus('저장 실패 — 지금 화면의 내용은 남아있지만 서버에는 아직 저장되지 않았어요.');
      document.getElementById('retrySaveBtn').style.display = 'inline-block';
    }
  }finally{
    saving = false;
    if(saveAgain){ saveAgain = false; saveData(false); }
  }
}
document.getElementById('retrySaveBtn').onclick = ()=> saveData();
function scheduleSave(){ clearTimeout(saveTimer); setStatus('저장 중…'); saveTimer=setTimeout(()=>saveData(false),300); }

function exportBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'schedule-backup-'+toISODate(new Date())+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.tasks)) throw new Error('형식이 올바르지 않습니다.');
      showConfirm('현재 화면의 내용을 이 백업 파일 내용으로 덮어쓸까요?', async ()=>{
        data = parsed;
        allowEmptySave = true;
        if(!data.people) data.people=[]; if(!data.periodOrder) data.periodOrder={};
        if(!data.weeklyDuty) data.weeklyDuty={};
        normalizeData(data);
        setStatus('저장 중…');
        await saveData(false, true); // 백업 불러오기는 병합하지 않고 파일 내용으로 덮어쓴다 (확인창에서 동의함)
        baseData = _clone(data);
        renderCurrentTab();
      });
    }catch(e){
      console.error(e);
      setStatus('백업 파일을 읽는 중 오류가 발생했습니다. JSON 형식을 확인해주세요.');
    }
  };
  reader.readAsText(file);
}

function allPeopleNames(){
  const set = new Set(data.people.map(p=>p.name));
  data.tasks.forEach(t=>{
    (t.assignees||[]).forEach(a=>set.add(a));
    (t.items||[]).forEach(it=>{ if(it.assignee) set.add(it.assignee); });
  });
  return Array.from(set);
}
function ensurePerson(name){
  if(!data.people.find(p=>p.name===name)) data.people.push({id:uid(), name, note:''});
}
function periodOrderVal(label){
  if(!(label in data.periodOrder)){
    const vals = Object.values(data.periodOrder);
    data.periodOrder[label] = vals.length ? Math.max(...vals)+1 : 0;
  }
  return data.periodOrder[label];
}

function passesFilter(t){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const tr = document.getElementById('trackFilter').value;
  const st = document.getElementById('statusFilter').value;
  if(tr && t.track!==tr) return false;
  if(st && t.status!==st) return false;
  if(q && !(t.title.toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q))) return false;
  return true;
}

function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function monthLabelFromDate(d){ const dt=new Date(d+'T00:00:00'); return `${dt.getFullYear()}년 ${dt.getMonth()+1}월`; }
function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ---------------- Overall view ----------------
function renderOverall(){
  const host = document.getElementById('overallView');
  host.innerHTML = '';

  host.appendChild(renderCalendarView());
  host.appendChild(renderElephantDuty());

  const listHead = document.createElement('div');
  listHead.style.cssText='display:flex;align-items:center;gap:10px;margin:18px 2px 8px;flex-wrap:wrap;';
  const listTitle = document.createElement('div');
  listTitle.style.cssText='font-size:13px;font-weight:600;color:var(--ink-soft);';
  listTitle.textContent = '검증 목록';
  listHead.appendChild(listTitle);
  const hideDoneWrap = document.createElement('label');
  hideDoneWrap.style.cssText='display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;';
  hideDoneWrap.innerHTML = `<input type="checkbox" id="hideDoneOverallChk"${hideDoneOverall?' checked':''}> 완료 항목 숨기기`;
  hideDoneWrap.querySelector('input').onchange = (e)=>{ hideDoneOverall = e.target.checked; renderOverall(); };
  listHead.appendChild(hideDoneWrap);
  host.appendChild(listHead);

  const groups = {};
  data.tasks.filter(passesFilter).filter(t=>t.track!=='leave').filter(t=> hideDoneOverall ? t.status!=='done' : true).forEach(t=>{
    const key = t.period || (t.start ? monthLabelFromDate(t.start) : '기간 미지정');
    (groups[key] = groups[key] || []).push(t);
  });
  const keys = Object.keys(groups).sort((a,b)=> periodOrderVal(a)-periodOrderVal(b));

  const listScroll = document.createElement('div');
  listScroll.className = 'list-scroll';
  host.appendChild(listScroll);

  if(keys.length===0){
    const p = document.createElement('div');
    p.className='empty'; p.textContent='조건에 맞는 작업이 없습니다.';
    listScroll.appendChild(p); return;
  }

  keys.forEach((key, idx)=>{
    const group = document.createElement('div');
    group.className='period-group';
    const head = document.createElement('div');
    head.className='period-head';
    head.innerHTML = `<span class="label">${key}</span><span class="count">${groups[key].length}건</span><div style="flex:1"></div>`;
    const up = document.createElement('button'); up.className='btn icon'; up.textContent='▲';
    up.disabled = idx===0;
    up.onclick = ()=>{ swapPeriodOrder(keys[idx-1], key); renderOverall(); };
    const down = document.createElement('button'); down.className='btn icon'; down.textContent='▼';
    down.disabled = idx===keys.length-1;
    down.onclick = ()=>{ swapPeriodOrder(key, keys[idx+1]); renderOverall(); };
    head.appendChild(up); head.appendChild(down);
    group.appendChild(head);

    groups[key].sort((a,b)=>(a.start||'').localeCompare(b.start||'')).forEach(t=>{
      group.appendChild(renderTaskRow(t));
    });
    listScroll.appendChild(group);
  });
}
function swapPeriodOrder(a,b){
  const va = periodOrderVal(a), vb = periodOrderVal(b);
  data.periodOrder[a]=vb; data.periodOrder[b]=va;
  scheduleSave();
}

function renderTaskRow(t){
  const row = document.createElement('div');
  row.className='task-row';
  const assigneesHtml = (t.assignees||[]).map(a=>`<span class="chip">${a}</span>`).join('') || '<span class="chip">미배정</span>';
  const itemsHtml = (t.items&&t.items.length) ? `<div class="subitems">${t.items.map(it=>`<div class="subitem">· <b>${escapeHtml(it.assignee||'미배정')}</b> — ${escapeHtml(it.text)} <span class="badge s-${it.status||t.status}" style="margin-left:2px">${STATUSES[it.status||t.status]}</span></div>`).join('')}</div>` : '';
  row.innerHTML = `
    <span class="badge b-${t.track}">${TRACKS[t.track]}</span>
    <span class="badge s-${t.status}">${STATUSES[t.status]}</span>
    <div><div class="title">${escapeHtml(t.title)}</div>${t.note?`<div class="note">${escapeHtml(t.note)}</div>`:''}${itemsHtml}</div>
    <div class="assignees">${assigneesHtml}</div>
    <div class="dates">${t.start||t.end ? (fmtDate(t.start)+' ~ '+fmtDate(t.end)) : ''}</div>
  `;
  const actions = document.createElement('div');
  actions.className='actions';
  const editBtn=document.createElement('button'); editBtn.className='btn icon'; editBtn.textContent='수정'; editBtn.onclick=()=>openModal(t);
  actions.appendChild(editBtn);
  row.appendChild(actions);
  return row;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderCalendarView(){
  const wrap = document.createElement('div');
  wrap.className='timeline-wrap';

  const nav = document.createElement('div'); nav.className='cal-nav';
  const prevBtn=document.createElement('button'); prevBtn.className='btn icon'; prevBtn.textContent='◀';
  const nextBtn=document.createElement('button'); nextBtn.className='btn icon'; nextBtn.textContent='▶';
  const todayBtn=document.createElement('button'); todayBtn.className='btn small'; todayBtn.textContent='오늘';
  const label=document.createElement('span'); label.style.cssText='font-weight:700;font-size:15px;color:var(--navy-deep);';
  label.textContent = `${calMonth.getFullYear()}년 ${calMonth.getMonth()+1}월`;
  prevBtn.onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderOverall(); };
  nextBtn.onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderOverall(); };
  todayBtn.onclick = ()=>{ calMonth = new Date(); calMonth.setDate(1); renderOverall(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn); nav.appendChild(todayBtn);
  wrap.appendChild(nav);

  const grid = document.createElement('div'); grid.className='cal-grid';
  ['일','월','화','수','목','금','토'].forEach(d=>{
    const h=document.createElement('div'); h.className='cal-dow'; h.textContent=d; grid.appendChild(h);
  });

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const startDow = new Date(year, month, 1).getDay();
  const gridStart = new Date(year, month, 1 - startDow);
  const todayStr = toISODate(new Date());
  const tasks = data.tasks.filter(passesFilter);
  const dated = tasks.filter(t=>t.start);

  // 그 달에 필요한 주 수만 그린다 (다음 달 날짜만 있는 줄은 만들지 않음)
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cellCount = Math.ceil((startDow + daysInMonth) / 7) * 7;
  for(let i=0;i<cellCount;i++){
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    const dateStr = toISODate(d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell'+(d.getMonth()!==month?' out':'')+(dateStr===todayStr?' today':'');
    const dnum = document.createElement('div'); dnum.className='cal-date'; dnum.textContent=d.getDate();
    cell.appendChild(dnum);
    dated.filter(t=>{
      const e = t.end || t.start;
      return dateStr>=t.start && dateStr<=e;
    }).forEach(t=>{
      const pill = document.createElement('div');
      pill.className = 'cal-pill badge b-'+t.track;
      pill.textContent = t.track==='leave' && (t.assignees||[]).length
        ? `${t.title} · ${t.assignees.join(', ')}`
        : t.title;
      pill.title = t.title+' ('+STATUSES[t.status]+')';
      pill.onclick = ()=>openModal(t);
      cell.appendChild(pill);
    });
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

// ---------------- 코끼리 에어컨 주간 담당자 (월~금, 주당 1명) ----------------
// data.weeklyDuty = { '그 주 월요일 날짜(YYYY-MM-DD)': '담당자 이름' }
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
function renderElephantDuty(){
  const box = document.createElement('div');
  box.className = 'timeline-wrap';
  box.style.marginTop = '14px';

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1), last = new Date(year, month+1, 0);

  const head = document.createElement('div');
  head.style.cssText = 'font-weight:700;font-size:14px;color:var(--navy-deep);margin-bottom:8px;';
  head.textContent = `코끼리 에어컨 담당자 · ${year}년 ${month+1}월 (월~금, 주 단위)`;
  box.appendChild(head);

  const names = allPeopleNames();
  const thisMon = toISODate(mondayOf(new Date()));
  const list = document.createElement('div');
  list.style.cssText = 'display:flex;flex-direction:column;gap:6px;';

  let mon = mondayOf(first);
  while(mon <= last){
    const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+4);
    if(fri >= first){ // 월~금이 이 달과 겹치는 주만 표시
      const key = toISODate(mon);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:'+(key===thisMon?'var(--surface-alt)':'var(--surface)')+';';
      const label = document.createElement('div');
      label.style.cssText = 'flex:1;font-size:13px;color:var(--ink);';
      label.textContent = `${mon.getMonth()+1}/${mon.getDate()}(월) ~ ${fri.getMonth()+1}/${fri.getDate()}(금)` + (key===thisMon ? '  · 이번 주' : '');
      row.appendChild(label);

      const sel = document.createElement('select');
      sel.style.cssText = 'min-width:140px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink);';
      const cur = (data.weeklyDuty||{})[key] || '';
      const opts = [''].concat(names);
      if(cur && !names.includes(cur)) opts.push(cur); // 인력 목록에서 빠진 이름도 기존 선택은 유지
      opts.forEach(n=>{
        const o = document.createElement('option');
        o.value = n; o.textContent = n || '미지정';
        if(n===cur) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = ()=>{
        if(!data.weeklyDuty) data.weeklyDuty = {};
        if(sel.value) data.weeklyDuty[key] = sel.value; else delete data.weeklyDuty[key];
        scheduleSave();
      };
      row.appendChild(sel);
      list.appendChild(row);
    }
    mon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+7);
  }
  box.appendChild(list);
  return box;
}

// 한 사람에게 배정된 항목 목록 (카드와 팝업이 같이 사용)
function personEntries(name, hideDone){
  const entries = [];
  const leaveTasks = [];
  data.tasks.filter(passesFilter).forEach(t=>{
    if(t.track==='leave'){
      if((t.assignees||[]).includes(name)) leaveTasks.push(t);
      return;
    }
    if(t.items && t.items.length){
      t.items.filter(it=>it.assignee===name).forEach(it=>{
        const st = it.status||t.status;
        if(hideDone && st==='done') return;
        entries.push({task:t, item:it, text: it.text, status: st, isItem:true});
      });
    }else if((t.assignees||[]).includes(name)){
      if(hideDone && t.status==='done') return;
      entries.push({task:t, text: t.title, status: t.status, isItem:false});
    }
  });
  entries.sort((a,b)=> periodOrderVal(a.task.period||'기간 미지정') - periodOrderVal(b.task.period||'기간 미지정'));
  leaveTasks.sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  return {entries, leaveTasks};
}

// 담당자 이름을 누르면 열리는 넓은 팝업: 그 사람의 전체 항목을 기간별로 크게 보여준다
function openPersonPopup(name){
  const old = document.getElementById('personPopup'); if(old) old.remove();
  let hideDone = window.__hideDone !== false;
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'personPopup'; ov.style.zIndex = 40; // 작업 수정 창(50)보다 아래
  const box = document.createElement('div');
  box.className = 'modal pp-box';
  ov.appendChild(box);
  // ESC: 다른 창(작업 수정·확인창)이 화면에 보이는 동안에는 팝업을 닫지 않는다
  const onKey = (e)=>{
    if(e.key!=='Escape') return;
    const otherOpen = [...document.querySelectorAll('.overlay')].some(o=> o.id!=='personPopup' && getComputedStyle(o).display!=='none');
    if(!otherOpen) close();
  };
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', (e)=>{ if(e.target===ov) close(); });

  function draw(){
    const {entries, leaveTasks} = personEntries(name, hideDone);
    box.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'pp-head';
    head.innerHTML = `<h3 style="margin:0;">${escapeHtml(name)}</h3><span class="pp-count">${entries.length}건</span><div style="flex:1"></div>`;
    const lab = document.createElement('label');
    lab.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;';
    lab.innerHTML = `<input type="checkbox"${hideDone?' checked':''}> 완료 항목 숨기기`;
    lab.querySelector('input').onchange = (e)=>{ hideDone = e.target.checked; draw(); };
    head.appendChild(lab);
    const x = document.createElement('button');
    x.className = 'btn small'; x.textContent = '닫기 ✕'; x.onclick = close;
    head.appendChild(x);
    box.appendChild(head);

    if(leaveTasks.length>0){
      const lv = document.createElement('div');
      lv.className = 'pp-leave';
      lv.innerHTML = leaveTasks.map(t=>{
        const range = (t.start||t.end) ? `${fmtDate(t.start)}${t.end&&t.end!==t.start?' ~ '+fmtDate(t.end):''} · ` : '';
        return `<div>${range}${escapeHtml(t.title)}</div>`;
      }).join('');
      lv.onclick = ()=>{ close(); openModal(leaveTasks[0]); };
      box.appendChild(lv);
    }

    if(entries.length===0){
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = '해당 없음';
      box.appendChild(e);
      return;
    }
    // 기간별로 묶어서 표시
    const groups = [];
    entries.forEach(en=>{
      const key = en.task.period || '기간 미지정';
      let g = groups.find(x=>x.key===key);
      if(!g){ g = {key, list:[]}; groups.push(g); }
      g.list.push(en);
    });
    const body = document.createElement('div');
    body.className = 'pp-body';
    groups.forEach(g=>{
      const gh = document.createElement('div');
      gh.className = 'pp-group';
      gh.innerHTML = `<span>${escapeHtml(g.key)}</span><span class="pp-count">${g.list.length}건</span>`;
      body.appendChild(gh);
      g.list.forEach(en=>{
        const t = en.task;
        const row = document.createElement('div');
        row.className = 'pp-row';
        const dates = (t.start||t.end) ? fmtDate(t.start)+' ~ '+fmtDate(t.end) : '';
        row.innerHTML = `<span class="badge b-${t.track}">${TRACKS[t.track]}</span>
          <select class="badge s-${en.status} pp-status" title="상태 변경">${Object.keys(STATUSES).map(k=>`<option value="${k}"${k===en.status?' selected':''}>${STATUSES[k]}</option>`).join('')}</select>
          <div class="pp-title">${escapeHtml(en.text)}${t.note&&!en.isItem?`<div class="pp-note">${escapeHtml(t.note)}</div>`:''}</div>
          <div class="pp-parent">${en.isItem?escapeHtml(t.title):''}</div>
          <div class="pp-dates">${dates}</div>`;
        row.onclick = ()=>{ close(); openModal(t); };
        // 상태는 이 창에서 바로 변경 (스케줄 화면으로 이동하지 않음)
        const sel = row.querySelector('.pp-status');
        sel.onclick = (e)=> e.stopPropagation();
        sel.onchange = ()=>{
          if(en.isItem) en.item.status = sel.value; else t.status = sel.value;
          scheduleSave();
          renderCurrentTab();
          const top = box.querySelector('.pp-body')?.scrollTop || 0;
          draw();
          const nb = box.querySelector('.pp-body'); if(nb) nb.scrollTop = top;
        };
        body.appendChild(row);
      });
    });
    box.appendChild(body);
  }
  draw();
  document.body.appendChild(ov);
}

  document.getElementById('fEnd').value = task?.end || '';

  const picker = document.getElementById('fAssignees');
  picker.innerHTML='';
  const names = allPeopleNames();
  const assigned = new Set(task?.assignees||[]);
  names.forEach(name=>{
    const lbl = document.createElement('label');

  const addBtn = document.createElement('button'); addBtn.className='btn small'; addBtn.textContent='추가'; addBtn.type='button';

    lbl.innerHTML = `<input type="checkbox" value="${n}" checked> ${n}`;

  };

function makeItemRow(item){

document.getElementById('saveTaskBtn').onclick = ()=>{
  const title = document.getElementById('fTitle').value.trim();
  const errBox = document.getElementById('formError');
  if(!title){ errBox.textContent='제목을 입력해주세요.'; errBox.style.display='block'; return; }
  errBox.style.display='none';
  const track = document.getElementById('fTrack').value;
  const status = document.getElementById('fStatus').value;
  const period = document.getElementById('fPeriod').value.trim();
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const note = document.getElementById('fNote').value.trim();
  const items = getItemsFromForm();
  items.forEach(it=>{ if(it.assignee) ensurePerson(it.assignee); });
  const checkedAssignees = getSelectedAssignees();
  const itemAssignees = items.map(it=>it.assignee).filter(Boolean);
  const assignees = Array.from(new Set([...checkedAssignees, ...itemAssignees]));
  assignees.forEach(ensurePerson);
  if(period) periodOrderVal(period);

  if(editingId){
    const t = data.tasks.find(t=>t.id===editingId);
    Object.assign(t, {title, track, status, period, start, end, note, assignees, items});
  }else{
    data.tasks.push({id:uid(), title, track, status, period, start, end, note, assignees, items});
  }
  scheduleSave();
  closeModal();
  renderCurrentTab();
};
document.getElementById('deleteTaskBtn').onclick = ()=>{
  const idToDelete = editingId;
  showConfirm('이 작업을 삭제할까요?', ()=>{
    data.tasks = data.tasks.filter(t=>t.id!==idToDelete);
    allowEmptySave = true; // 사용자가 직접 삭제한 경우의 빈 저장은 허용
    scheduleSave(); closeModal(); renderCurrentTab();
  });
};

// ---------------- 공용 입력 창 (보유시료에서 사용) ----------------
// fields: {key,label,type:'text|number|date|select|textarea|tags', options:[[value,label]], required, half, showIf(values), hint}
function openFormModal({title, fields, values, onSave, onDelete, width}){
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.style.zIndex = 60;
  const box = document.createElement('div');
  box.className = 'modal'; if(width) box.style.maxWidth = width+'px';
  box.innerHTML = `<h3></h3><div class="fm-body"></div><div class="fm-error" style="display:none;color:#A6394A;font-size:12.5px;margin-top:6px;"></div><div class="modal-actions"></div>`;
  box.querySelector('h3').textContent = title;
  ov.appendChild(box);
  const body = box.querySelector('.fm-body');
  const ctrls = {}, wraps = {};
  let pair = null;
  fields.forEach(f=>{
    const wrap = document.createElement('div'); wrap.className = 'field';
    const lab = document.createElement('label'); lab.textContent = f.label + (f.required ? ' *' : '');
    wrap.appendChild(lab);
    let el;
    if(f.type==='select'){
      el = document.createElement('select');
      (typeof f.options==='function' ? f.options() : f.options).forEach(o=>{
        const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; el.appendChild(op);
      });
    }else if(f.type==='textarea'){
      el = document.createElement('textarea');
    }else{
      el = document.createElement('input');
      el.type = (f.type==='tags') ? 'text' : f.type;
      if(f.type==='number'){ el.step = f.step || 'any'; if(f.min!=null) el.min = f.min; if(f.max!=null) el.max = f.max; }
    }
    if(f.placeholder) el.placeholder = f.placeholder;
    const v = values ? values[f.key] : undefined;
    if(f.type==='tags') el.value = (v||[]).join(', ');
    else if(v!=null) el.value = v;
    else if(f.default!=null) el.value = f.default;
    el.addEventListener('input', refresh); el.addEventListener('change', refresh);
    wrap.appendChild(el);
    if(f.hint){ const h = document.createElement('div'); h.style.cssText='font-size:11.5px;color:var(--ink-soft);margin-top:3px;'; h.textContent = f.hint; wrap.appendChild(h); }
    ctrls[f.key] = el; wraps[f.key] = wrap;
    if(f.half){
      if(!pair){ pair = document.createElement('div'); pair.className = 'two-col'; body.appendChild(pair); }
      pair.appendChild(wrap);
      if(pair.children.length===2) pair = null;
    }else{ pair = null; body.appendChild(wrap); }
  });
  function read(){
    const out = {};
    fields.forEach(f=>{
      const el = ctrls[f.key]; let v = el.value;
      if(f.type==='number') v = (v==='' ? null : Number(v));
      else if(f.type==='tags') v = v.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
      else if(typeof v==='string') v = v.trim();
      out[f.key] = v;
    });
    return out;
  }
  function refresh(){
    const vals = read();
    fields.forEach(f=>{ if(f.showIf) wraps[f.key].style.display = f.showIf(vals) ? '' : 'none'; });
  }
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e)=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  const actions = box.querySelector('.modal-actions');
  if(onDelete){
    const del = document.createElement('button'); del.className = 'btn'; del.textContent = '삭제';
    del.style.cssText = 'margin-right:auto;color:#A6394A;border-color:#A6394A;';
    del.onclick = ()=> showConfirm('삭제할까요?', ()=>{ close(); onDelete(); });
    actions.appendChild(del);
  }
  const cancel = document.createElement('button'); cancel.className = 'btn'; cancel.textContent = '취소'; cancel.onclick = close;
  const save = document.createElement('button'); save.className = 'btn primary'; save.textContent = '저장';
  save.onclick = ()=>{
    const vals = read();
    const err = box.querySelector('.fm-error');
    for(const f of fields){
      if(f.showIf && !f.showIf(vals)) continue;
      const empty = f.type==='tags' ? false : (vals[f.key]===''||vals[f.key]==null||Number.isNaN(vals[f.key]));
      if(f.required && empty){ err.textContent = f.label+' 항목을 입력해주세요.'; err.style.display = 'block'; return; }
      if(f.type==='number' && vals[f.key]!=null && ((f.min!=null && vals[f.key]<f.min) || (f.max!=null && vals[f.key]>f.max))){
        err.textContent = f.label+' 값은 '+f.min+' ~ '+f.max+' 범위로 입력해주세요.'; err.style.display = 'block'; return;
      }
    }
    fields.forEach(f=>{ if(f.showIf && !f.showIf(vals)) vals[f.key] = ''; });
    close(); onSave(vals);
  };
  actions.appendChild(cancel); actions.appendChild(save);
  document.body.appendChild(ov);
  refresh();
  const first = body.querySelector('input,select,textarea'); if(first) first.focus();
}
function personOptions(withBlank){
  const list = allPeopleNames().map(n=>[n,n]);
  return withBlank ? [['', '전체 담당자'], ...list] : list;
}

// ---------------- 보유시료현황 ----------------
const ENVS = {QA:'QA', Staging:'Staging', Prod:'Prod'};
const SCOPES = {personal:'개인용', shared:'공통용'};
let sampleFilter = {owner:'', env:'', scope:'', q:''};
let sampleView = 'table';

function samplesFiltered(){
  const q = sampleFilter.q.toLowerCase();
  return data.samples.filter(s=>{
    if(sampleFilter.owner && s.owner!==sampleFilter.owner) return false;
    if(sampleFilter.env && s.env!==sampleFilter.env) return false;
    if(sampleFilter.scope && s.scope!==sampleFilter.scope) return false;
    if(q && !((s.name||'').toLowerCase().includes(q) || (s.cpu||'').toLowerCase().includes(q) || (s.ip||'').toLowerCase().includes(q) || (s.items||[]).join(' ').toLowerCase().includes(q) || (s.note||'').toLowerCase().includes(q))) return false;
    return true;
  });
}
function sumQty(list){ return list.reduce((a,s)=> a + (Number(s.qty)||0), 0); }
function sampleChips(s){
  return (s.items||[]).map(i=>`<span class="chip" style="padding:1px 8px;font-size:11.5px;">${escapeHtml(i)}</span>`).join(' ');
}
function openSampleForm(sample){
  const people = personOptions(false);
  openFormModal({
    title: sample ? '보유시료 수정' : '보유시료 추가',
    values: sample,
    fields: [
      {key:'name', label:'시료명', type:'select', options:[['PC','PC'],['Appliance','Appliance']]},
      {key:'cpu', label:'CPU', type:'text', placeholder:'예: i7-12700', half:true},
      {key:'ip', label:'서버 IP', type:'text', placeholder:'예: 192.168.0.10', half:true},
      {key:'qty', label:'시료수', type:'number', required:true, min:0, max:9999, step:1, default:1, half:true},
      {key:'scope', label:'구분', type:'select', options:Object.entries(SCOPES), half:true},
      {key:'owner', label:'담당자', type:'select', options:people.length?people:[['','(인력 탭에서 담당자를 먼저 추가)']], half:true},
      {key:'env', label:'평가환경', type:'select', options:Object.entries(ENVS), half:true},
      {key:'items', label:'평가항목 (쉼표로 구분)', type:'tags', placeholder:'예: 영상, 녹화, 펌웨어'},
      {key:'note', label:'비고 (위치, 시리얼 등)', type:'textarea'}
    ],
    onSave: v=>{
      if(v.owner) ensurePerson(v.owner);
      if(sample) Object.assign(sample, v); else data.samples.push({id:uid(), ...v});
      scheduleSave(); renderSamples();
    },
    onDelete: sample ? ()=>{
      data.samples = data.samples.filter(s=>s.id!==sample.id);
      scheduleSave(); renderSamples();
    } : null
  });
}
function renderSamples(){
  const host = document.getElementById('samplesView');
  host.innerHTML = '';
  const all = data.samples, list = samplesFiltered();

  const sum = document.createElement('div'); sum.className = 'sum-cards';
  const card = (label, val, sub)=>`<div class="sum-card"><div class="sum-label">${label}</div><div class="sum-val">${val}</div>${sub?`<div class="sum-sub">${sub}</div>`:''}</div>`;
  sum.innerHTML = card('총 시료수', sumQty(all)+'대', all.length+'건')
    + Object.keys(ENVS).map(e=>card(e, sumQty(all.filter(s=>s.env===e))+'대')).join('')
    + card('개인용', sumQty(all.filter(s=>s.scope==='personal'))+'대')
    + card('공통용', sumQty(all.filter(s=>s.scope==='shared'))+'대');
  host.appendChild(sum);

  const brk = document.createElement('div'); brk.className = 'brk';
  brk.innerHTML = Object.entries(SCOPES).map(([sk, sl])=>{
    const rows = all.filter(s=>s.scope===sk);
    const types = ['PC','Appliance'].map(t=>{
      const tr = rows.filter(s=>s.name===t);
      const byCpu = {};
      tr.forEach(s=>{ const c = (s.cpu||'').trim() || '(미입력)'; byCpu[c] = (byCpu[c]||0) + (Number(s.qty)||0); });
      const cpus = Object.entries(byCpu).sort((a,b)=>b[1]-a[1])
        .map(([c,n])=>`<div class="brk-cpu"><span>${escapeHtml(c)}</span><span>${n}대</span></div>`).join('')
        || '<div class="brk-cpu"><span>-</span></div>';
      return `<div class="brk-type"><div class="brk-type-h"><span>${t}</span><span>${sumQty(tr)}대</span></div>${cpus}</div>`;
    }).join('');
    return `<div class="brk-box"><div class="brk-head">${escapeHtml(sl)} <small>총 ${sumQty(rows)}대</small></div>${types}</div>`;
  }).join('');
  host.appendChild(brk);

  const bar = document.createElement('div'); bar.className = 'toolbar';
  const opt = (arr, cur)=> arr.map(o=>`<option value="${escapeHtml(o[0])}"${o[0]===cur?' selected':''}>${escapeHtml(o[1])}</option>`).join('');
  bar.innerHTML = `<input type="text" id="smQ" placeholder="CPU/IP/평가항목/비고 검색" value="${escapeHtml(sampleFilter.q)}">
    <select id="smOwner">${opt(personOptions(true), sampleFilter.owner)}</select>
    <select id="smEnv">${opt([['','전체 환경'], ...Object.entries(ENVS)], sampleFilter.env)}</select>
    <select id="smScope">${opt([['','개인용/공통용'], ...Object.entries(SCOPES)], sampleFilter.scope)}</select>
    <select id="smView">${opt([['table','표 보기'],['person','담당자별 보기']], sampleView)}</select>
    <div class="spacer"></div>
    <button class="btn primary" id="smAdd">+ 시료 추가</button>`;
  host.appendChild(bar);
  const q = bar.querySelector('#smQ');
  q.oninput = ()=>{ sampleFilter.q = q.value; const pos = q.selectionStart; renderSamples(); const nq = document.getElementById('smQ'); nq.focus(); nq.setSelectionRange(pos,pos); };
  bar.querySelector('#smOwner').onchange = e=>{ sampleFilter.owner = e.target.value; renderSamples(); };
  bar.querySelector('#smEnv').onchange = e=>{ sampleFilter.env = e.target.value; renderSamples(); };
  bar.querySelector('#smScope').onchange = e=>{ sampleFilter.scope = e.target.value; renderSamples(); };
  bar.querySelector('#smView').onchange = e=>{ sampleView = e.target.value; renderSamples(); };
  bar.querySelector('#smAdd').onclick = ()=> openSampleForm(null);

  if(list.length===0){
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = all.length ? '조건에 맞는 시료가 없습니다.' : '등록된 시료가 없습니다. 오른쪽 위 "+ 시료 추가"로 등록해주세요.';
    host.appendChild(e); return;
  }
  if(sampleView==='person'){
    const board = document.createElement('div'); board.className = 'person-board';
    const owners = Array.from(new Set(list.map(s=>s.owner||'(담당자 미지정)')));
    owners.forEach(o=>{
      const mine = list.filter(s=>(s.owner||'(담당자 미지정)')===o);
      const c = document.createElement('div'); c.className = 'person-card';
      c.innerHTML = `<div class="pname">${escapeHtml(o)} <span style="font-size:11px;font-weight:400;color:var(--ink-soft);">· ${sumQty(mine)}대 / ${mine.length}건</span></div>`;
      mine.forEach(s=>{
        const r = document.createElement('div'); r.className = 'ptask'; r.style.cursor = 'pointer';
        r.innerHTML = `<span class="badge e-${s.env}">${escapeHtml(s.env)}</span>
          <div><div class="ttl">${escapeHtml(s.name)} <span style="color:var(--ink-soft);font-weight:400;">× ${Number(s.qty)||0}</span> <span class="badge sc-${s.scope}" style="margin-left:2px">${SCOPES[s.scope]||''}</span></div>
          <div class="meta">${[s.cpu?'CPU '+escapeHtml(s.cpu):'', s.ip?'IP '+escapeHtml(s.ip):''].filter(Boolean).join(' · ')}</div>
          <div class="meta">${sampleChips(s)}${s.note?' · '+escapeHtml(s.note):''}</div></div>`;
        r.onclick = ()=> openSampleForm(s);
        c.appendChild(r);
      });
      board.appendChild(c);
    });
    host.appendChild(board); return;
  }
  const rows = list.slice().sort((a,b)=> (a.owner||'').localeCompare(b.owner||'') || (a.name||'').localeCompare(b.name||''));
  const wrap = document.createElement('div'); wrap.className = 'tbl-wrap';
  wrap.innerHTML = `<table class="tbl"><thead><tr><th>시료명</th><th>CPU</th><th>서버 IP</th><th class="num">시료수</th><th>구분</th><th>평가환경</th><th>담당자</th><th>평가항목</th><th>비고</th></tr></thead><tbody></tbody></table>`;
  const tb = wrap.querySelector('tbody');
  rows.forEach(s=>{
    const tr = document.createElement('tr'); tr.style.cursor = 'pointer';
    tr.innerHTML = `<td><b>${escapeHtml(s.name)}</b></td><td>${escapeHtml(s.cpu||'')}</td><td>${escapeHtml(s.ip||'')}</td><td class="num">${Number(s.qty)||0}</td>
      <td><span class="badge sc-${s.scope}">${SCOPES[s.scope]||''}</span></td>
      <td><span class="badge e-${s.env}">${escapeHtml(s.env||'')}</span></td>
      <td>${escapeHtml(s.owner||'')}</td><td>${sampleChips(s)}</td><td class="muted">${escapeHtml(s.note||'')}</td>`;
    tr.onclick = ()=> openSampleForm(s);
    tb.appendChild(tr);
  });
  host.appendChild(wrap);
}

// ---------------- Aging관리 (외부 모니터링 사이트 삽입) ----------------
const BLAZE_URL = 'https://blaze-auto-aging.vercel.app/monitoring';
const TC_DASH_URL = 'http://192.168.30.67:5000/common/tc-manager'; // 사내망 http: https 페이지에서는 브라우저가 iframe을 막을 수 있어 새 창 링크를 함께 둠
function renderFrameTab(hostId, url, title){
  const host = document.getElementById(hostId);
  if(host.firstChild) return; // iframe을 다시 만들지 않아 필터/스크롤 상태 유지
  host.innerHTML = `<div class="frame-bar"><a href="${url}" target="_blank" rel="noopener" title="화면이 비어 있으면 새 창으로 열어주세요">새 창에서 열기 ↗</a></div>
    <iframe class="frame-box" src="${url}" title="${title}" loading="lazy"></iframe>`;
}
function renderAgingMgmt(){ renderFrameTab('agingMgmtView', BLAZE_URL, 'Aging 관리'); }
function renderTcDash(){ renderFrameTab('tcDashView', TC_DASH_URL, 'TC 대시보드'); }

// ---------------- 탭 전환 ----------------
const TAB_DEFS = {
  overall:{btn:'tabOverall', view:'overallView', render:()=>renderOverall(), toolbar:true},
  person: {btn:'tabPerson',  view:'personView',  render:()=>renderPerson(),  toolbar:true},
  samples:{btn:'tabSamples', view:'samplesView', render:()=>renderSamples(), toolbar:false},
  agingMgmt:{btn:'tabAgingMgmt', view:'agingMgmtView', render:()=>renderAgingMgmt(), toolbar:false},
  tcDash:{btn:'tabTcDash', view:'tcDashView', render:()=>renderTcDash(), toolbar:false}
};
function showTab(name){
  currentTab = name;
  Object.entries(TAB_DEFS).forEach(([k,d])=>{
    document.getElementById(d.btn).classList.toggle('active', k===name);
    document.getElementById(d.view).style.display = (k===name) ? 'block' : 'none';
  });
  document.getElementById('scheduleToolbar').style.display = TAB_DEFS[name].toolbar ? '' : 'none';
  TAB_DEFS[name].render();
}
Object.entries(TAB_DEFS).forEach(([k,d])=>{ document.getElementById(d.btn).onclick = ()=> showTab(k); });

['searchInput'].forEach(id=>document.getElementById(id).addEventListener('input', renderCurrentTab));
['trackFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener('change', renderCurrentTab));

// ---------------- Init ----------------
document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
};

(async function init(){
  setStatus('불러오는 중…');
  if(!hasCloudStorage) document.getElementById('fallbackNotice').style.display = 'block';
  await loadData();
  if(hasCloudStorage && !loadOk){
    // 읽기 실패: 예시 데이터를 만들거나 저장하지 않고, 5초마다 다시 불러온다
    document.getElementById('fallbackNotice').style.display = 'block';
    setStatus('서버에서 데이터를 불러오지 못했어요. 다시 시도 중… (이 동안 저장은 막혀 있어요)');
    const retry = setInterval(async ()=>{
      await loadData();
      if(loadOk){
        clearInterval(retry);
        document.getElementById('fallbackNotice').style.display = 'none';
        renderOverall(); setStatus('준비 완료'); watchRemoteChanges();
      }
    }, 5000);
    renderOverall();
    return;
  }
  // 서버 문서가 "정말로 없을 때"(최초 실행)만 예시 데이터를 만든다
  if(data.tasks.length===0 && data.people.length===0 && (!hasCloudStorage || !docExists)){
    // seed with a couple of example rows so the layout isn't empty on first run
    ensurePerson('담당자A');
    data.tasks.push({id:uid(), title:'예시 작업 — 여기를 눌러 수정하거나 삭제하세요', track:'etc', status:'plan', period:'예시 기간', start:'', end:'', note:'', assignees:['담당자A']});
    scheduleSave();
  }
  renderOverall();
  setStatus('준비 완료');
  watchRemoteChanges();
})();
</script>
